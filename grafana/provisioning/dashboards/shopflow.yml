# Dashboards come from git (dashboards/), the UI cannot change or delete them (ADR-0011).
apiVersion: 1
providers:
  - name: shopflow
    orgId: 1
    folder: ShopFlow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
