# Milestone 0.9: one-off memory test of ClickHouse + Airflow on Pi5 (NFR-7).
# Not the real docker-compose.pi5.yml. Run on Pi5:
#   PI5_HOST=... CLICKHOUSE_PASSWORD=... AIRFLOW_JWT_SECRET=... docker compose -f docker-compose.memtest.yml up -d
# Budget: sum of mem_limit = 5.5 GB, plus 0.5 GB reserved for the dashboard = 6 GB.

x-airflow: &airflow
  image: apache/airflow:3.1.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET}
    AIRFLOW__API__WORKERS: "1"
    # memtest only: no login. The real deployment uses AIRFLOW_ADMIN_* from .env.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    # max_server_memory_usage is 2 GB; the rest is for the mapped binary and page cache,
    # which count against the cgroup limit (2560m caused constant reclaim and swapping).
    mem_limit: 2816m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: shopflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/config.d/memtest.xml:/etc/clickhouse-server/config.d/memtest.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${PI5_HOST:?set PI5_HOST}:8123:8123"
      - "${PI5_HOST}:9000:9000"

  airflow-db:
    image: postgres:17-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow # internal network only, no published port
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    mem_limit: 768m
    command: db migrate
    depends_on:
      airflow-db: { condition: service_healthy }

  airflow-apiserver:
    <<: *airflow
    mem_limit: 768m
    command: api-server
    ports:
      - "${PI5_HOST}:8080:8080"
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow
    # LocalExecutor runs tasks inside this container: ~200 MB per task in Airflow 3.
    mem_limit: 1152m
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-dag-processor:
    <<: *airflow
    mem_limit: 512m
    command: dag-processor
    depends_on:
      airflow-init: { condition: service_completed_successfully }

volumes:
  clickhouse-data:
  airflow-db:
  airflow-logs:
