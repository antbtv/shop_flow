# Laptop (ADR-0010): Postgres is published on ${LAPTOP_HOST}. Without Wi-Fi, or in another network,
# that address is not ours; nonlocal bind lets docker-proxy take the port anyway, so the
# postgres container (and the whole CDC chain) still starts. Packets to it never arrive there.
# Install: sudo cp infra/laptop/etc/sysctl.d/90-shopflow.conf /etc/sysctl.d/ && sudo sysctl --system
net.ipv4.ip_nonlocal_bind = 1
