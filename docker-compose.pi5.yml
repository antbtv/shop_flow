# Pi5 stack (NFR-2): ClickHouse now, Airflow in Milestone 4. Run on Pi5 from ~/shopflow:
#   docker compose -f docker-compose.pi5.yml up -d
# Needs ~/shopflow/.env on Pi5 (template: infra/pi5/pi5.env.example). Deploy: ADR-0007.
# Memory: ADR-0004. Network: ports only on the LAN address, ADR-0003.
name: shopflow

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    # max_server_memory_usage is 2 GB; the rest is for the mapped binary and page cache.
    mem_limit: 2816m
    restart: unless-stopped
    # Let ClickHouse finish in-flight inserts and flush parts on shutdown (default is 10 s).
    stop_grace_period: 60s
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      # A non-default user makes the image entrypoint remove the built-in passwordless "default".
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      # SQL-driven users and grants: the Spark writer is created by a migration before M2.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/config.d/shopflow.xml:/etc/clickhouse-server/config.d/shopflow.xml:ro
      - ./clickhouse/users.d/shopflow-profile.xml:/etc/clickhouse-server/users.d/shopflow-profile.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${PI5_HOST:?set PI5_HOST}:8123:8123"
      - "${PI5_HOST}:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  clickhouse-data:
